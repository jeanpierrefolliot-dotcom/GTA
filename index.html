<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070a10">
<link rel="manifest" href="manifest.webmanifest">
<title>Police Kodiaq 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a10;font-family:Arial,sans-serif}
#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff}
.panel{background:rgba(4,8,14,.76);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);border-radius:14px;padding:10px 12px}
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}
.label{font-size:10px;color:#aeb9c8}.value{font-size:18px;font-weight:900}
#mission{position:absolute;top:76px;left:12px;max-width:290px}
#buttons{position:absolute;bottom:12px;left:12px;right:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;pointer-events:auto}
button{min-height:48px;border:1px solid rgba(255,255,255,.18);border-radius:13px;background:rgba(10,16,25,.88);color:#fff;font-weight:900;touch-action:none}
button.active{background:#15579a;border-color:#69b5ff}
#steer{grid-column:span 2;display:grid;grid-template-columns:1fr 1fr;gap:8px}
#go{grid-column:span 2}.wide{grid-column:span 2}
@media(max-width:520px){#buttons{grid-template-columns:repeat(2,1fr)}#steer,#go,.wide{grid-column:span 2}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div id="top">
  <div class="panel"><div class="label">POLICE NATIONALE</div><div class="value">ŠKODA KODIAQ</div></div>
  <div class="panel"><div class="label">VITESSE</div><div class="value"><span id="speed">0</span> km/h</div></div>
 </div>
 <div id="mission" class="panel"><div class="label">MISSION</div><div class="value">PATROUILLE</div><div id="missionText" class="label">Rejoins le point d'intervention.</div></div>
 <div id="buttons">
  <div id="steer"><button id="left">◀</button><button id="right">▶</button></div>
  <button id="go">ACCÉLÉRER</button><button id="brake">FREIN</button>
  <button id="lights">🚨 RAMPE</button><button id="siren">🔊 SIRÈNE</button>
  <button id="view">🎥 CAMÉRA</button><button id="missionBtn">📻 APPEL</button>
  <button id="reset" class="wide">↻ REPLACER LE VÉHICULE</button>
 </div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8ea5b5);
scene.fog=new THREE.Fog(0x8ea5b5,90,500);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1200);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.querySelector("#game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd8ecff,0x33402f,2.0));
const sun=new THREE.DirectionalLight(0xffffff,2.4);
sun.position.set(-100,150,80);sun.castShadow=true;scene.add(sun);

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(1400,1400),
 new THREE.MeshStandardMaterial({color:0x566058,roughness:1})
);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

function makeBox(w,h,d,color,x,y,z,rot=0){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.78}));
 m.position.set(x,y,z);m.rotation.y=rot;m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}

/* Ville procédurale : réseau de rues + blocs urbains */
for(let i=-6;i<=6;i++){
 makeBox(15,.08,1300,0x252a30,i*55,.04,0);
 makeBox(1300,.08,15,0x252a30,0,.045,i*55);
}
const buildingColors=[0x747b82,0x9a8e7d,0x596873,0x85857c,0x6c7176];
for(let i=-6;i<=6;i++)for(let j=-6;j<=6;j++){
 const h=12+((Math.abs(i*13+j*7)+3)%7)*5;
 const w=27+((i+j+30)%4)*3,d=27+((i*3+j+40)%4)*3;
 const x=i*55+((j%2)*8),z=j*55+((i%2)*8);
 makeBox(w,h,d,buildingColors[(i+j+40)%buildingColors.length],x,h/2,z);
 if(h>35)makeBox(w*.5,4,d*.4,0x4b5156,x,h+2,z);
}

/* Arbres */
function tree(x,z){
 const g=new THREE.Group();
 const t=new THREE.Mesh(new THREE.CylinderGeometry(.8,1.1,6,8),new THREE.MeshStandardMaterial({color:0x4d392b}));
 t.position.y=3;g.add(t);
 const c=new THREE.Mesh(new THREE.IcosahedronGeometry(4.5,1),new THREE.MeshStandardMaterial({color:0x285039}));
 c.position.y=7.2;g.add(c);
 g.position.set(x,0,z);scene.add(g);
}
for(let i=-6;i<=6;i+=2)for(let j=-6;j<=6;j+=2)tree(i*55+18,j*55+18);

/* Kodiaq procédural */
const car=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(3.8,1.35,7.3),new THREE.MeshStandardMaterial({color:0xe7e8e6,metalness:.1,roughness:.4}));
body.position.y=1.35;body.castShadow=true;car.add(body);
const stripe=new THREE.Mesh(new THREE.BoxGeometry(3.84,.38,7.35),new THREE.MeshStandardMaterial({color:0x153f70}));
stripe.position.y=1.36;car.add(stripe);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(3.35,1.25,3.7),new THREE.MeshStandardMaterial({color:0x202b35,roughness:.25}));
cabin.position.set(0,2.45,-.35);cabin.castShadow=true;car.add(cabin);
const hood=new THREE.Mesh(new THREE.BoxGeometry(3.5,.35,2.2),new THREE.MeshStandardMaterial({color:0xe7e8e6}));
hood.position.set(0,2.02,2.45);car.add(hood);
const wheelGeo=new THREE.CylinderGeometry(.58,.58,.42,24);
for(const sx of[-1.85,1.85])for(const sz of[-2.3,2.3]){
 const w=new THREE.Mesh(wheelGeo,new THREE.MeshStandardMaterial({color:0x101114}));
 w.rotation.z=Math.PI/2;w.position.set(sx,.7,sz);w.castShadow=true;car.add(w);
}
const lightbar=new THREE.Group();
for(const sx of[-.7,.7]){
 const l=new THREE.Mesh(new THREE.BoxGeometry(.82,.2,.44),new THREE.MeshStandardMaterial({color:0x1687ff,emissive:0x006cff,emissiveIntensity:0}));
 l.position.set(sx,3.25,.05);lightbar.add(l);
}
car.add(lightbar);scene.add(car);
car.position.set(0,0,0);

let speed=0,heading=0,view=0,lights=false,siren=false;
let throttle=false,brake=false,left=false,right=false;
const keys={};

function bind(id,on,off=on){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{e.preventDefault();on()});
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>b.addEventListener(ev,off));
}
bind("go",()=>throttle=true,()=>throttle=false);
bind("brake",()=>brake=true,()=>brake=false);
bind("left",()=>left=true,()=>left=false);
bind("right",()=>right=true,()=>right=false);

document.getElementById("lights").onclick=()=>{
 lights=!lights;document.getElementById("lights").classList.toggle("active",lights);
};
document.getElementById("siren").onclick=()=>{
 siren=!siren;document.getElementById("siren").classList.toggle("active",siren);
};
document.getElementById("view").onclick=()=>view=(view+1)%3;
document.getElementById("reset").onclick=()=>{car.position.set(0,0,0);speed=0;heading=0};

document.getElementById("missionBtn").onclick=()=>{
 const m=document.getElementById("missionText");
 m.textContent="Intervention : rendez-vous au point rouge.";
};

addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});

let last=performance.now();
function animate(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 const go=throttle||keys.w||keys.arrowup;
 const br=brake||keys.s||keys.arrowdown;
 const l=left||keys.a||keys.arrowleft,r=right||keys.d||keys.arrowright;

 if(go)speed=Math.min(45,speed+20*dt);else speed=Math.max(0,speed-6*dt);
 if(br)speed=Math.max(0,speed-32*dt);

 const steer=(l?-1:0)+(r?1:0);
 heading+=steer*dt*(.8+speed/55);
 car.rotation.y=heading;
 car.position.x+=Math.sin(heading)*speed*dt;
 car.position.z+=Math.cos(heading)*speed*dt;
 car.position.x=THREE.MathUtils.clamp(car.position.x,-360,360);
 car.position.z=THREE.MathUtils.clamp(car.position.z,-360,360);

 const pulse=Math.sin(now*.018)>0;
 lightbar.children.forEach((m,i)=>{
   m.material.emissiveIntensity=lights?(pulse===(i===0)?5:.35):0;
 });
 document.getElementById("speed").textContent=Math.round(speed*3.6);
 document.getElementById("siren").textContent=siren&&Math.floor(now/350)%2?"🔔 SIRÈNE":"🔊 SIRÈNE";

 const fwd=new THREE.Vector3(Math.sin(heading),0,Math.cos(heading));
 let cp,look;
 if(view===0){cp=car.position.clone().addScaledVector(fwd,-12);cp.y+=6.5;look=car.position.clone().addScaledVector(fwd,10);look.y+=1.4}
 else if(view===1){cp=car.position.clone();cp.y+=3.3;look=car.position.clone().addScaledVector(fwd,20);look.y+=1.8}
 else{cp=car.position.clone().addScaledVector(fwd,14);cp.y+=3;look=car.position.clone();look.y+=1.4}
 camera.position.lerp(cp,.12);camera.lookAt(look);

 renderer.render(scene,camera);
 requestAnimationFrame(animate);
}
addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});
requestAnimationFrame(animate);
</script>
</body>
</html>
